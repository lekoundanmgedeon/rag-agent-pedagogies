name: CI

# C'est le garde-fou qui empêche les deux moitiés du projet de re-diverger :
# une pull request qui casse les tests ou l'analyse statique ne peut pas être
# fusionnée. Sans cela, la fusion NURU × ATS se referait dans six mois.

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
    branches: [main]

# Une nouvelle poussée annule la vérification en cours sur la même branche :
# inutile de payer deux exécutions pour un commit déjà remplacé.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Analyse statique (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Installer ruff
        # Version bornée comme dans pyproject.toml : une nouvelle règle activée
        # en amont ne doit pas faire échouer une PR qui n'a rien changé.
        run: pip install "ruff>=0.6,<1"
      - name: Vérifier
        working-directory: agent-tuteur-api
        run: ruff check .

  tests:
    name: Tests (avec PostgreSQL)
    runs-on: ubuntu-latest

    # Les tests d'API et de persistance exigent une vraie base : sans elle, 96
    # tests sont silencieusement ignorés — dont tous les tests de contrôle
    # d'accès, précisément ceux qu'on ne veut jamais voir sauter.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: fusion_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: agent-tuteur-api/requirements.txt

      - name: Installer les dépendances
        working-directory: agent-tuteur-api
        run: |
          pip install -r requirements.txt
          pip install -e .

      - name: Appliquer les migrations
        working-directory: agent-tuteur-api
        env:
          DATABASE_URL: postgresql+asyncpg://test:test@localhost:5432/fusion_ci
        run: alembic upgrade head

      - name: Lancer la suite complète
        working-directory: agent-tuteur-api
        env:
          TEST_DATABASE_URL: postgresql+asyncpg://test:test@localhost:5432/fusion_ci
        run: pytest -q

      - name: Vérifier que le schéma OpenAPI committé est à jour
        # Le schéma versionné est le contrat avec le frontend. S'il diverge du
        # code, les types TypeScript du frontend décrivent une API qui n'existe
        # plus — et la compilation ne le voit pas. On régénère donc et on exige
        # qu'il n'y ait aucune différence.
        working-directory: agent-tuteur-api
        run: |
          python scripts/export_openapi.py openapi.json
          git diff --exit-code openapi.json || {
            echo "::error::Le schéma OpenAPI a changé. Lancez :"
            echo "  cd agent-tuteur-api && python scripts/export_openapi.py openapi.json"
            echo "  cd ../agent-tuteur-web-next && npm run gen:api"
            exit 1
          }

  frontend:
    name: Build du frontend (Next.js)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: agent-tuteur-web-next/package-lock.json
      - name: Installer
        working-directory: agent-tuteur-web-next
        run: npm ci

      - name: Vérifier que les types générés sont à jour
        # Deuxième maillon de la chaîne anti-divergence : le schéma OpenAPI est
        # vérifié côté API, les types le sont ici. Ensemble, ils garantissent
        # que le frontend compile contre l'API réelle, pas contre son souvenir.
        working-directory: agent-tuteur-web-next
        run: |
          npm run gen:api
          git diff --exit-code src/types/api.d.ts || {
            echo "::error::Types désynchronisés. Lancez : npm run gen:api"
            exit 1
          }

      - name: Vérifier les types
        working-directory: agent-tuteur-web-next
        run: npm run typecheck

      - name: Construire
        working-directory: agent-tuteur-web-next
        run: npm run build

  image-api:
    name: Build de l'image Docker de l'API
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Construire l'image
        # Les autres travaux tournent sur Python 3.12 ; l'image Docker est en
        # **3.11**, le plancher déclaré par pyproject.toml. Sans cette étape, un
        # épinglage valable seulement en 3.12 casse le déploiement sans que rien
        # ne le signale — c'est exactement ce qui s'est produit avec
        # `numpy==2.5.1` (voir JOURNAL_FUSION.md, module 7).
        run: docker build -t agent-tuteur-api:ci agent-tuteur-api

  frontend-vue:
    # Frontend historique (cf. JOURNAL_FUSION.md, module 8). À retirer en même
    # temps que `agent-tuteur-web/` — chantier distinct de la sortie de Render.
    name: Build du frontend Vue (historique)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: agent-tuteur-web/package-lock.json
      - name: Installer
        working-directory: agent-tuteur-web
        run: npm ci
      - name: Construire
        working-directory: agent-tuteur-web
        run: npm run build
