# Blueprint Render — déploiement de démonstration, un seul service web.
#
# Architecture volontairement réduite par rapport à docker-compose.prod.yml
# (postgres + redis + qdrant + api + worker + web + nginx). Ce qui saute et
# pourquoi c'est sans danger :
#   - worker ARQ + Redis : /api/documents se replie sur les BackgroundTasks du
#     process API quand Redis est absent (api/routes/documents.py, api/main.py
#     ::_try_create_arq_pool). Un Background Worker Render est de toute façon
#     payant. L'ingestion reste fonctionnelle, simplement in-process.
#   - Qdrant : VECTOR_BACKEND=memory suffit pour une démo — le corpus d'exemple
#     est ré-ingéré à chaque démarrage (api/main.py, lifespan). Contrepartie :
#     les documents téléversés depuis l'espace admin disparaissent au
#     redémarrage. Pour les conserver, voir la section Qdrant Cloud plus bas.
#   - nginx : l'API sert elle-même le SPA (api/main.py::_mount_spa).
#
# Déploiement : Render → New → Blueprint, pointer sur ce dépôt. Les variables
# marquées `sync: false` sont à saisir dans le tableau de bord (jamais commitées).

services:
  - type: web
    name: agent-tuteur-demo
    runtime: docker
    plan: free
    region: frankfurt          # région gratuite la plus proche du Sénégal
    dockerfilePath: ./Dockerfile.render
    dockerContext: .
    healthCheckPath: /health   # répond 200 sans authentification
    envVars:
      # Base managée déclarée plus bas. `connectionString` est l'URL INTERNE
      # (même région, pas de TLS exigé) ; render-start.sh la convertit au
      # dialecte postgresql+asyncpg attendu par l'application.
      - key: DATABASE_URL
        fromDatabase:
          name: agent-tuteur-db
          property: connectionString

      # Pas de Redis : l'API démarre en mode dégradé (ingestion in-process).
      # URL volontairement injoignable et sans retry — cf. _try_create_arq_pool.
      - key: REDIS_URL
        value: redis://127.0.0.1:6379/0

      - key: VECTOR_BACKEND
        value: memory
      - key: EMBEDDING_BACKEND
        value: light          # pur numpy : aucun modèle à télécharger, tient dans les 512 Mo

      # LLM : Mistral en priorité, repli automatique sur le mock si la clé est
      # absente (Ollama est injoignable depuis Render). Clé à saisir au déploiement.
      - key: LLM_BACKEND
        value: auto
      - key: MISTRAL_API_KEY
        sync: false

      # SPA et API partagent la même origine : CORS inutile, on n'ouvre rien.
      - key: CORS_ORIGINS
        value: ""
      - key: JWT_SECRET
        generateValue: true   # secret aléatoire généré par Render, jamais en clair ici

      # Compte administrateur initial, créé au premier démarrage par
      # render-start.sh (idempotent ensuite).
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false

      # --- Persistance des documents téléversés (optionnel) ---
      # Décommenter après avoir créé un cluster gratuit sur Qdrant Cloud, et
      # basculer VECTOR_BACKEND sur `qdrant` ci-dessus.
      # - key: QDRANT_URL
      #   sync: false
      # - key: QDRANT_API_KEY
      #   sync: false

databases:
  - name: agent-tuteur-db
    plan: free                 # expire au bout de 30 jours (politique Render)
    databaseName: tuteur
    user: tuteur
    region: frankfurt          # doit correspondre à celle du service web
